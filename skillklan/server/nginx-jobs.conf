# skillklan: SkillKlan Job на Server2 — Cloudflare → nginx :443 → 127.0.0.1:3737.
# Ставиться як /etc/nginx/sites-available/jobs (+ посилання в sites-enabled), default прибрано.
#
# До :443 пускає лише Cloudflare (ufw, cloudflare-sync); справжню IP людини nginx бере з
# CF-Connecting-IP лише для адрес Cloudflare (conf.d/cloudflare-realip.conf, той самий скрипт).
# Сертифікат — Cloudflare Origin CA, ключ створено на сервері й назовні не передавався.
# Розраховано на nginx 1.24 (Ubuntu 24.04): `listen … http2`, без директиви `http2 on`.

# Без рядка запиту й referer: у параметрах адреси можуть бути дані людей.
log_format jobs_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time "$http_user_agent"';

# Будь-яке інше імʼя на :443 — обірваний TLS, без сертифіката й без відповіді.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jobs.skillklan.com.ua;

    ssl_certificate     /etc/ssl/jobs/jobs.pem;
    ssl_certificate_key /etc/ssl/jobs/jobs.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:jobs:10m;

    access_log /var/log/nginx/jobs.access.log jobs_noquery;
    error_log  /var/log/nginx/jobs.error.log warn;

    server_tokens off;
    # Резюме студентів (PDF/DOCX) вантажаться сюди.
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:3737;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # Відповіді AI бувають довгими.
        proxy_read_timeout 120s;
    }
}
