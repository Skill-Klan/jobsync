# skillklan: збірка, публікація й викладка образу. На PR у main — збірка й перевірки вимог до образу.
# На push у main (рішення власника 2026-10-19: «пуш → CI → прод», без тегу й другої збірки) — паралельно
# lint/тести (ci.yml), скрипти деплою (skillklan-deploy-scripts.yml) і збірка зі smoke-тестом; образ, що
# пройшов smoke, публікується, і саме його digest іде на Server2 (skillklan-deploy.yml). Пушив власник —
# без кнопки; будь-хто інший — кнопка в Telegram. (Апстрімні release.yml і wiki.yml видалено 2026-10-14.)
name: SkillKlan image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR: новий пуш скасовує застарілий прогін. main: НЕ скасовує — прогін міг бути посеред викладки;
# наступний чекає, а третій пуш заміщає того, хто чекає (найновіший коміт однаково доїде).
concurrency:
  group: sk-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/skill-klan/jobsync
  # 1.1.22 апстріму — еталон «як було», на якому smoke-тест МУСИТЬ падати.
  UPSTREAM_IMAGE: ghcr.io/gsync/jobsync@sha256:9fcc216f7846b071be41a7714b7baa631767e0143534d16c45f0f686729f2a3c

jobs:
  prisma-version:
    name: Prisma CLI in image == package-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          lock=$(node -p "require('./package-lock.json').packages['node_modules/prisma'].version")
          img=$(sed -n 's/^ARG PRISMA_VERSION=//p' Dockerfile)
          echo "package-lock: $lock / Dockerfile: $img"
          [ -n "$lock" ] && [ "$lock" = "$img" ]

  smoke-is-not-vacuous:
    name: Smoke test fails on upstream image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker pull -q "$UPSTREAM_IMAGE"
      - run: |
          if skillklan/tests/image-smoke.sh "$UPSTREAM_IMAGE"; then
            echo "::error::smoke test PASSED on the upstream image — it proves nothing"
            exit 1
          fi
          echo "OK: smoke test fails on upstream, as it must"

  # Паралельно з перевірками вище, а не після них: вони гейтять викладку (deploy), а не збірку —
  # так від пушу до проду на ~3 хв менше.
  image:
    name: Build, smoke, publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64, loaded locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: sk-jobsync:ci
          cache-from: type=gha,scope=sk-amd64
          cache-to: type=gha,mode=max,scope=sk-amd64
      - name: Smoke test (requirements R1–R5)
        run: skillklan/tests/image-smoke.sh sk-jobsync:ci
      - name: Log in to ghcr
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Теги — `main` і `sha-<коміт>`; на сервер іде digest, не тег.
      - name: Publish the tested image and print its digest
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          tag="sha-${GITHUB_SHA:0:12}"
          docker tag sk-jobsync:ci "$IMAGE:$tag"
          docker tag sk-jobsync:ci "$IMAGE:main"
          docker push "$IMAGE:$tag"
          docker push "$IMAGE:main"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$tag")
          digest="${ref#*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest after push: $ref"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ref\` (tags \`$tag\`, \`main\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "$ref"

  # Ті самі lint і тести, що на PR, — перед кожною викладкою (на PR ci.yml біжить сам).
  tests:
    name: Lint and tests
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  # Скрипти деплою й сервера (обгортка, nginx, compose, «хто викладає», кнопка) — теж перед викладкою.
  scripts:
    name: Deploy scripts
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/skillklan-deploy-scripts.yml

  # Викладка рівно того образу, що пройшов smoke, — лише коли зелене все вище.
  deploy:
    name: Deploy
    needs: [prisma-version, smoke-is-not-vacuous, image, tests, scripts]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/skillklan-deploy.yml
    with:
      digest: ${{ needs.image.outputs.digest }}
      # Цей digest зібрано тут же з main — не довіреному кнопка, а не відмова, як при ручному запуску.
      digest_from_build: true
    secrets: inherit
