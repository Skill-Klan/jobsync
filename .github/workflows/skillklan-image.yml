# skillklan: збірка й публікація образу форку. Апстрімні release.yml і wiki.yml у форку вимкнені
# (вони публікують від імені апстріму). Тут: перевірки вимог до образу на кожен PR у main,
# публікація — лише на тег `sk-*`, і на сервер іде саме той образ, що пройшов smoke-тест.
name: SkillKlan image

on:
  pull_request:
    branches: [main]
  push:
    tags: ["sk-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sk-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/skill-klan/jobsync
  # 1.1.22 апстріму — еталон «як було», на якому smoke-тест МУСИТЬ падати.
  UPSTREAM_IMAGE: ghcr.io/gsync/jobsync@sha256:9fcc216f7846b071be41a7714b7baa631767e0143534d16c45f0f686729f2a3c

jobs:
  prisma-version:
    name: Prisma CLI in image == package-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          lock=$(node -p "require('./package-lock.json').packages['node_modules/prisma'].version")
          img=$(sed -n 's/^ARG PRISMA_VERSION=//p' Dockerfile.skillklan)
          echo "package-lock: $lock / Dockerfile.skillklan: $img"
          [ -n "$lock" ] && [ "$lock" = "$img" ]

  smoke-is-not-vacuous:
    name: Smoke test fails on upstream image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker pull -q "$UPSTREAM_IMAGE"
      - run: |
          if skillklan/tests/image-smoke.sh "$UPSTREAM_IMAGE"; then
            echo "::error::smoke test PASSED on the upstream image — it proves nothing"
            exit 1
          fi
          echo "OK: smoke test fails on upstream, as it must"

  image:
    name: Build, smoke, publish
    runs-on: ubuntu-latest
    needs: [prisma-version, smoke-is-not-vacuous]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64, loaded locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.skillklan
          platforms: linux/amd64
          load: true
          tags: sk-jobsync:ci
          cache-from: type=gha,scope=sk-amd64
          cache-to: type=gha,mode=max,scope=sk-amd64
      - name: Smoke test (requirements R1–R5)
        run: skillklan/tests/image-smoke.sh sk-jobsync:ci
      - name: Log in to ghcr
        if: startsWith(github.ref, 'refs/tags/sk-')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image and print its digest
        if: startsWith(github.ref, 'refs/tags/sk-')
        run: |
          docker tag sk-jobsync:ci "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:$GITHUB_REF_NAME"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_REF_NAME")
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ref\` (tag \`$GITHUB_REF_NAME\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "$ref"
