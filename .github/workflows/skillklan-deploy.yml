# skillklan: деплой SkillKlan Job на Server2. Викликається з «SkillKlan image» на кожен push у main
# (digest образу, що щойно пройшов smoke) або вручну з digest — для відкату чи повтору.
#
#   digest існує в ghcr → хто викладає: власник — далі, будь-хто інший — кнопка в Telegram (та сама,
#   що для сайту; fail closed); ручний запуск не власником — відмова → на Server2 примусова команда
#   jobsync-deploy: копія /data, заміна, перевірка здоровʼя, відкат
#
# Ключ SERVER2_DEPLOY_KEY уміє на сервері лише `deploy <digest>` і `status` (ForceCommand). Він і секрет
# кнопки лежать у середовищі server2, яке дозволяє лише main: воркфлоу з будь-якої іншої гілки їх не бачить.
# Лог цього рану публічний — обгортка логів застосунку сюди не друкує.
name: SkillKlan deploy

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Image digest from the publish run (sha256:…)"
        required: true
        type: string
      ask:
        description: "Ask in Telegram even when the owner runs it"
        type: boolean
        default: false
  workflow_call:
    inputs:
      digest:
        required: true
        type: string
      ask:
        type: boolean
        default: false
      # Лише для виклику: digest зібрано й перевірено в цьому ж рані. У ручного запуску такого входу немає
      # (GitHub відкидає невідомі входи), тож там digest завжди вважається вписаним людиною.
      digest_from_build:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Server2
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Секрети деплою — лише в цьому середовищі; його правило гілок (Settings → Environments) — тільки main.
    environment: server2
    # На рівні job, а не воркфлоу: так черга діє й тоді, коли деплой викликано з «SkillKlan image».
    concurrency:
      group: sk-deploy-server2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: The digest is a published SkillKlan Job image
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::not an image digest (sha256:<64 hex>)"; exit 1; }
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:skill-klan/jobsync:pull" | jq -r .token)
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/skill-klan/jobsync/manifests/$DIGEST")
          [ "$code" = 200 ] || { echo "::error::ghcr.io/skill-klan/jobsync@$DIGEST not found (HTTP $code)"; exit 1; }
          echo "OK: ghcr.io/skill-klan/jobsync@$DIGEST"

      # Пушив власник (агенти пушать його ж акаунтом) — без кнопки; будь-хто інший — кнопка.
      # Ручний запуск із digest — лише довіреним, іншим — відмова (крок падає).
      # Довірені — змінна репозиторію DEPLOY_TRUSTED_ACTORS; порожня — кнопка для всіх (fail-closed).
      - name: Who deploys
        id: who
        env:
          DEPLOY_TRUSTED_ACTORS: ${{ vars.DEPLOY_TRUSTED_ACTORS }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          FORCE_ASK: ${{ inputs.ask }}
          # Ручний запуск: digest_from_build у нього немає → manual.
          DEPLOY_DIGEST_SOURCE: ${{ inputs.digest_from_build && 'build' || 'manual' }}
        run: bash skillklan/deploy/deploy-who.sh

      - name: Ask the owner in Telegram (not the owner's push)
        if: steps.who.outputs.gate != 'skip'
        env:
          DEPLOY_GATE_SECRET: ${{ secrets.DEPLOY_GATE_SECRET }}
          GATE_ID: jobsync-${{ github.run_id }}-${{ github.run_attempt }}
          GATE_REPO: ${{ github.repository }}
          GATE_SHA: ${{ github.sha }}
          GATE_ACTOR: ${{ github.actor }}
          # Через env, а не всередині run: — так ввід не потрапляє в шелл.
          GATE_MESSAGE: "SkillKlan Job → Server2: ${{ inputs.digest }}"
        run: bash skillklan/deploy/deploy-gate.sh

      - name: Deploy on Server2
        env:
          SSH_KEY: ${{ secrets.SERVER2_DEPLOY_KEY }}
          DIGEST: ${{ inputs.digest }}
        run: |
          [ -n "$SSH_KEY" ] || { echo "::error::SERVER2_DEPLOY_KEY is not set"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/server2_deploy
          chmod 600 ~/.ssh/server2_deploy
          ssh -i ~/.ssh/server2_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile=skillklan/deploy/server2.known_hosts \
              -o ConnectTimeout=20 -o ServerAliveInterval=30 \
              svc-jobsync@80.241.214.221 "deploy $DIGEST"

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/server2_deploy
