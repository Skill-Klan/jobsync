name: CI

on:
  pull_request:
    branches: [dev, main]
  # skillklan: ті самі lint і тести — перед кожною викладкою з main (skillklan-image.yml).
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npm test
